<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库问答 · 曹炳宇</title>
  <meta name="description" content="曹炳宇（24002120309）课程作业：知识库问答（RAG），支持 doc/docx/ppt/pptx/pdf/txt 上传解析、向量检索与大模型作答。">
  <link rel="stylesheet" href="css/cby_style.css">
  <link rel="stylesheet" href="css/cby_ai.css">
</head>
<body>
  <canvas class="cby_bg_canvas" id="cby_bgCanvas" aria-hidden="true"></canvas>

  <div class="cby_page cby_ai_page">
    <header class="cby_header">
      <a class="cby_brand" href="index.html">
        <span class="cby_brand_mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
        </span>
        <span class="cby_brand_text">COURSE PROJECT <span class="cby_brand_dot">·</span> 2026</span>
      </a>
      <div class="cby_ai_tag">KNOWLEDGE BASE <span class="cby_brand_dot">/</span> RAG</div>
    </header>

    <main class="cby_ai_main">
      <section class="cby_ai_hero">
        <p class="cby_eyebrow">知识库 · 检索增强生成</p>
        <h1 class="cby_ai_title">专属知识库客服</h1>
        <p class="cby_ai_subtitle">上传 doc、docx、ppt、pptx、pdf、txt 文件，后端解析切分后用 bge-m3 生成向量存入 MySQL；提问时按余弦相似度召回最相关片段，再交给大模型基于片段作答并标注来源</p>

        <div class="cby_ai_api">
          <span class="cby_ai_api_method">POST</span>
          <code class="cby_ai_api_url" id="cby_kbApiUrl">/api/kb/ask</code>
          <span class="cby_ai_api_hint" id="cby_kbStatus">等待提问</span>
        </div>
      </section>

      <section class="cby_ai_grid">
        <aside class="cby_panel">
          <div class="cby_panel_head">
            <strong class="cby_panel_title">知识库管理</strong>
            <span class="cby_panel_hint" id="cby_docCount">加载中…</span>
          </div>

          <label class="cby_drop" id="cby_dropZone">
            <input type="file" id="cby_fileInput" accept=".txt,.md,.pdf,.doc,.docx,.ppt,.pptx" hidden>
            <span class="cby_drop_icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4M7 9l5-5 5 5"></path>
                <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
              </svg>
            </span>
            <span class="cby_drop_text">点击或拖拽上传知识库文件</span>
            <span class="cby_drop_hint">支持 doc / docx / ppt / pptx / pdf / txt / md，单个文件不超过 20MB</span>
          </label>

          <p class="cby_status_line" id="cby_uploadStatus">等待上传…</p>
          <div class="cby_doc_list" id="cby_docList"></div>
        </aside>

        <div class="cby_panel cby_qa">
          <div class="cby_qa_head">
            <strong class="cby_panel_title">知识库问答</strong>
            <button type="button" class="cby_btn_ghost" id="cby_qaClear">清空对话</button>
          </div>
          <div class="cby_qa_list" id="cby_qaList" aria-live="polite"></div>
          <form class="cby_qa_form" id="cby_qaForm" autocomplete="off">
            <textarea class="cby_qa_input" id="cby_qaInput" rows="1" maxlength="500"
              placeholder="根据知识库提问，例如：知识库支持哪些文件格式？"></textarea>
            <button type="submit" class="cby_btn_primary" id="cby_qaSend">提问</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="cby_footer">
      <span>曹炳宇 · 24002120309 · 2026-11-25</span>
      <span>上传解析与向量化结果已输出到浏览器控制台</span>
    </footer>
  </div>

  <script src="js/cby_main.js"></script>
  <script src="js/cby_kb.js"></script>
</body>
</html>
