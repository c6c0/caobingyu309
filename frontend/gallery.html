<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文列表 · 曹炳宇</title>
  <meta name="description" content="曹炳宇（24002120309）课程作业：通过 GET /api/gallery 读取 MySQL 表 cby_gallery，以响应式网格展示上图下文卡片。">
  <link rel="stylesheet" href="css/cby_style.css">
  <link rel="stylesheet" href="css/cby_gallery.css">
</head>
<body>
  <canvas class="cby_bg_canvas" id="cby_bgCanvas" aria-hidden="true"></canvas>

  <div class="cby_page cby_gallery_page">
    <header class="cby_header">
      <a class="cby_brand" href="index.html">
        <span class="cby_brand_mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
        </span>
        <span class="cby_brand_text">COURSE PROJECT <span class="cby_brand_dot">·</span> 2026</span>
      </a>
      <div class="cby_db_tag">GALLERY <span class="cby_brand_dot">/</span> cby_gallery</div>
    </header>

    <main class="cby_gallery_main">
      <section class="cby_gallery_hero">
        <p class="cby_eyebrow">WEB 前端设计 · 课程作业</p>
        <h1 class="cby_gallery_title">图文列表</h1>
        <p class="cby_gallery_subtitle">数据取自 MySQL 表 cby_gallery，以响应式网格展示「上图下文」卡片，配图为本地生成的场景实景图</p>

        <!-- 顶部接口地址条：由 cby_gallery.js 写入当前实际调用的完整地址 -->
        <div class="cby_api_box">
          <span class="cby_api_method">GET</span>
          <code class="cby_api_url" id="cby_galleryApiUrl">/api/gallery</code>
          <span class="cby_api_hint" id="cby_galleryApiStatus">等待请求</span>
        </div>
      </section>

      <section class="cby_gallery_section" aria-labelledby="cby_gallerySectionTitle">
        <div class="cby_section_head">
          <div>
            <h2 class="cby_section_title" id="cby_gallerySectionTitle">图文网格</h2>
            <p class="cby_section_hint">共 <strong class="cby_gallery_count" id="cby_galleryCount">0</strong> 条 · 图片、标题、描述；图片加载失败时显示占位色块</p>
          </div>
          <span class="cby_section_badge">GALLERY GRID</span>
        </div>

        <div class="cby_gallery_grid" id="cby_galleryGrid" aria-live="polite">
          <p class="cby_gallery_tip">正在加载图文数据…</p>
        </div>
      </section>
    </main>

    <footer class="cby_footer">
      <span>曹炳宇 · 24002120309 · 2026-11-20</span>
      <span>服务器返回的数据与错误信息已输出到浏览器控制台</span>
    </footer>
  </div>

  <script src="js/cby_main.js"></script>
  <script src="js/cby_gallery.js"></script>
</body>
</html>
