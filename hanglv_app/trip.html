<!DOCTYPE html>
<!-- 行程页 - caobingyu -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程 - 航旅纵横 | caobingyu</title>
  <link rel="stylesheet" href="css/cao_style.css">
</head>
<body>
  <div class="cao_page">
    <header class="cao_header">
      <div class="cao_header__tabs" style="justify-content:flex-start;padding-left:16px">
        <div class="cao_header__tab">待出行</div>
        <div class="cao_header__tab">已结束</div>
        <div class="cao_header__tab cao_header__tab--active">家人行程</div>
        <div class="cao_header__tab">···</div>
      </div>
    </header>

    <!-- 家人行程 hero -->
    <section class="cao_family_hero">
      <img src="images/family-flight.jpg" alt="家人出行">
      <div class="cao_family_hero__title">家人出行<br>你也全程"看得见"</div>
      <div class="cao_family_hero__subtitle">把安心装进口袋，守护每一次出发</div>
    </section>

    <div class="cao_card">
      <div class="cao_family_feature">
        <div class="cao_family_feature__icon"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg></div>
        <div>
          <div class="cao_family_feature__title">随时确认爸妈孩子的行程</div>
          <div class="cao_family_feature__desc">帮爸妈、孩子订票后，出票状态、未来行程一目了然</div>
        </div>
      </div>
      <div class="cao_divider"></div>
      <div class="cao_family_feature">
        <div class="cao_family_feature__icon"><svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1S9.6 1.84 9.18 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg></div>
        <div>
          <div class="cao_family_feature__title">帮他们值机选座</div>
          <div class="cao_family_feature__desc">爸妈不会用APP、孩子选座没经验？你在手机上就能帮他们完成值机选座</div>
        </div>
      </div>
      <div class="cao_divider"></div>
      <div class="cao_family_feature">
        <div class="cao_family_feature__icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></div>
        <div>
          <div class="cao_family_feature__title">不用打电话 也知道他们一路平安</div>
          <div class="cao_family_feature__desc">家人独自出门时，安检、登机、落地，你都会收到提醒</div>
        </div>
      </div>
    </div>

    <div style="padding:10px 16px;text-align:center">
      <span class="cao_sub">可免费试用30天 ›</span>
    </div>
    <div style="padding:0 16px">
      <button class="cao_btn cao_btn--blue cao_btn--block cao_btn--lg">＋ 添加家人并开启守护</button>
      <p class="cao_sub cao_center cao_mt8">*仅限60岁以上老人，16岁以下儿童</p>
    </div>

    <nav class="cao_tabbar">
      <a class="cao_tabbar__item" href="index.html"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg><span>首页</span></a>
      <a class="cao_tabbar__item cao_tabbar__item--active" href="trip.html"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg><span>行程</span></a>

      <a class="cao_tabbar__item" href="flight_status.html"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg><span>动态</span></a>
      <a class="cao_tabbar__item" href="mine.html"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg><span>我</span></a>
    </nav>
  </div>
