<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>移动端底部导航 · 字体图标 | ATELIER</title>
  <link rel="stylesheet" href="font/iconfont.css" />
  <style>
    :root {
      --wy-bg: #FAF7F2;
      --wy-surface: #FFFFFF;
      --wy-text: #1A1A1A;
      --wy-text-muted: #6B6B6B;
      --wy-accent: #C9A96E;
      --wy-accent-dark: #8B7355;
      --wy-border: #E8E2D9;
      --wy-danger: #E5484D;
      --wy-tabbar-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Georgia", "Cambria", "Times New Roman", serif;
      background-color: var(--wy-bg);
      color: var(--wy-text);
      line-height: 1.6;
      /* 给固定底栏留出空间 */
      padding-bottom: calc(var(--wy-tabbar-h) + env(safe-area-inset-bottom) + 24px);
    }

    /* --- 品牌头图 --- */
    .cby_hero {
      text-align: center;
      padding: 64px 24px 32px;
    }

    .cby_hero_kicker {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--wy-accent-dark);
      margin-bottom: 20px;
    }

    .cby_hero h1 {
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .cby_hero p {
      font-size: 0.95rem;
      color: var(--wy-text-muted);
      font-style: italic;
    }

    /* --- 内容卡片（展示滚动效果） --- */
    .cby_feed {
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      gap: 16px;
    }

    .cby_feed_card {
      background: var(--wy-surface);
      border: 1px solid var(--wy-border);
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cby_feed_card .iconfont {
      font-size: 1.6rem;
      color: var(--wy-accent-dark);
      flex-shrink: 0;
    }

    .cby_feed_info h2 {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .cby_feed_info p {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--wy-text-muted);
    }

    /* --- 固定底部导航（自适应宽度） --- */
    .cby_tabbar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px; /* 小屏占满，大屏封顶居中 */
      height: var(--wy-tabbar-h);
      background: var(--wy-surface);
      border-top: 1px solid var(--wy-border);
      display: flex;
      /* 适配 iPhone 底部安全区 */
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -4px 24px rgba(26, 26, 26, 0.05);
      z-index: 100;
    }

    .cby_tab_item {
      flex: 1; /* 四项均分自适应宽度 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: var(--wy-text-muted);
      position: relative;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 顶部激活指示条 */
    .cby_tab_item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 32px;
      height: 2px;
      background: var(--wy-accent);
      transition: transform 0.25s ease;
    }

    .cby_tab_item .iconfont {
      font-size: 1.4rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .cby_tab_label {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    /* 选中态 */
    .cby_tab_item.cby_active {
      color: var(--wy-accent-dark);
    }

    .cby_tab_item.cby_active::before {
      transform: translateX(-50%) scaleX(1);
    }

    .cby_tab_item.cby_active .iconfont {
      transform: translateY(-2px);
    }

    /* --- 右上角数字徽章 --- */
    .cby_badge {
      position: absolute;
      top: 10px;
      right: calc(50% - 24px);
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      background: var(--wy-danger);
      border: 2px solid var(--wy-surface);
      border-radius: 10px;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      line-height: 13px;
      text-align: center;
    }

    /* --- 右上角红点 --- */
    .cby_dot {
      position: absolute;
      top: 12px;
      right: calc(50% - 16px);
      width: 8px;
      height: 8px;
      background: var(--wy-danger);
      border: 2px solid var(--wy-surface);
      border-radius: 50%;
    }

    /* --- 返回首页 --- */
    .cby_back_home {
      max-width: 460px;
      margin: 0 auto;
      padding: 8px 16px 32px;
      text-align: center;
    }

    .cby_back_link {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--wy-text);
      padding: 10px 28px;
      border: 1px solid var(--wy-accent);
      transition: background 0.3s, color 0.3s;
    }

    .cby_back_link:hover {
      background: var(--wy-accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- 品牌头图 -->
  <header class="cby_hero">
    <div class="cby_hero_kicker">mobile tabbar · web font</div>
    <h1>底部导航 · 字体图标</h1>
    <p>iconfont 字体方案 · 四项均分 · 徽章与红点</p>
  </header>

  <!-- 内容卡片 -->
  <main class="cby_feed">
    <article class="cby_feed_card">
      <i class="iconfont icon-home-g"></i>
      <div class="cby_feed_info">
        <h2>主页 · Home</h2>
        <p>fixed · adaptive · 4 items</p>
      </div>
    </article>
    <article class="cby_feed_card">
      <i class="iconfont icon-icon_favorite"></i>
      <div class="cby_feed_info">
        <h2>收藏 · Favorites</h2>
        <p>数字徽章 cby_badge · 12</p>
      </div>
    </article>
    <article class="cby_feed_card">
      <i class="iconfont icon-shoucang"></i>
      <div class="cby_feed_info">
        <h2>关注 · Follow</h2>
        <p>红点 cby_dot · 未读提醒</p>
      </div>
    </article>
    <article class="cby_feed_card">
      <i class="iconfont icon-icon-test"></i>
      <div class="cby_feed_info">
        <h2>我的 · Profile</h2>
        <p>数字徽章 cby_badge · 6</p>
      </div>
    </article>

    <!-- 返回首页 -->
    <div class="cby_back_home" style="padding:16px 0 0;">
      <a class="cby_back_link" href="index.html">← 返回工坊</a>
    </div>
  </main>

  <!-- 固定底部导航 -->
  <nav class="cby_tabbar">
    <a class="cby_tab_item cby_active" href="#home">
      <i class="iconfont icon-home-g"></i>
      <span class="cby_tab_label">主页</span>
    </a>
    <a class="cby_tab_item" href="#favorite">
      <i class="iconfont icon-icon_favorite"></i>
      <span class="cby_badge">12</span>
      <span class="cby_tab_label">收藏</span>
    </a>
    <a class="cby_tab_item" href="#follow">
      <i class="iconfont icon-shoucang"></i>
      <span class="cby_dot"></span>
      <span class="cby_tab_label">关注</span>
    </a>
    <a class="cby_tab_item" href="#mine">
      <i class="iconfont icon-icon-test"></i>
      <span class="cby_badge">6</span>
      <span class="cby_tab_label">我的</span>
    </a>
  </nav>

  <script>
    // cby_ 前缀：底部导航交互
    const cby_tabItems = document.querySelectorAll('.cby_tab_item');

    cby_tabItems.forEach(function (cby_item) {
      cby_item.addEventListener('click', function (cby_event) {
        cby_event.preventDefault();

        // 切换选中态
        document.querySelector('.cby_tab_item.cby_active').classList.remove('cby_active');
        this.classList.add('cby_active');

        // 点击后清除该项的徽章 / 红点（模拟已读）
        const cby_badge = this.querySelector('.cby_badge');
        const cby_dot = this.querySelector('.cby_dot');
        if (cby_badge) { cby_badge.remove(); }
        if (cby_dot) { cby_dot.remove(); }
      });
    });
  </script>
</body>
</html>
