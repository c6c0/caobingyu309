<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATELIER · 图标设计工坊</title>
  <style>
    :root {
      --wy-bg: #FAF7F2;
      --wy-bg-dark: #1A1A1A;
      --wy-text: #1A1A1A;
      --wy-text-muted: #6B6B6B;
      --wy-accent: #C9A96E;
      --wy-accent-dark: #8B7355;
      --wy-border: #E8E2D9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Georgia", "Cambria", "Times New Roman", serif;
      background-color: var(--wy-bg);
      color: var(--wy-text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .wy_main {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    .wy_brand {
      text-align: center;
      margin-bottom: 80px;
    }

    .wy_brand_mark {
      display: inline-block;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--wy-accent-dark);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--wy-accent);
    }

    .wy_brand h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .wy_brand p {
      font-size: 1.05rem;
      color: var(--wy-text-muted);
      font-style: italic;
    }

    .wy_nav_list {
      list-style: none;
      display: grid;
      gap: 24px;
    }

    .wy_nav_item {
      border: 1px solid var(--wy-border);
      background: #fff;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .wy_nav_item:hover {
      border-color: var(--wy-accent);
      box-shadow: 0 8px 32px rgba(201, 169, 110, 0.15);
      transform: translateY(-2px);
    }

    .wy_nav_link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      text-decoration: none;
      color: var(--wy-text);
    }

    .wy_nav_info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wy_nav_title {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .wy_nav_desc {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.85rem;
      color: var(--wy-text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .wy_nav_arrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 1.5rem;
      color: var(--wy-accent);
      transition: transform 0.3s ease;
    }

    .wy_nav_item:hover .wy_nav_arrow {
      transform: translateX(8px);
    }

    .wy_footer {
      text-align: center;
      margin-top: 80px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--wy-text-muted);
    }

    @media (max-width: 600px) {
      .wy_main { padding: 48px 20px; }
      .wy_nav_link { padding: 24px 20px; flex-direction: column; align-items: flex-start; gap: 16px; }
      .wy_nav_arrow { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <main class="wy_main">
    <header class="wy_brand">
      <div class="wy_brand_mark">ATELIER · ICONOGRAPHY</div>
      <h1>图标设计工坊</h1>
      <p>两种经典图标方案 · 字体与矢量的对话</p>
    </header>

    <nav>
      <ul class="wy_nav_list">
        <li class="wy_nav_item">
          <a class="wy_nav_link" href="iconfont-1.html">
            <span class="wy_nav_info">
              <span class="wy_nav_title">Font Awesome</span>
              <span class="wy_nav_desc">字体图标 · Web Font</span>
            </span>
            <span class="wy_nav_arrow">→</span>
          </a>
        </li>
        <li class="wy_nav_item">
          <a class="wy_nav_link" href="inconfont-2.html">
            <span class="wy_nav_info">
              <span class="wy_nav_title">Lucide</span>
              <span class="wy_nav_desc">矢量图标 · SVG</span>
            </span>
            <span class="wy_nav_arrow">→</span>
          </a>
        </li>
        <li class="wy_nav_item">
          <a class="wy_nav_link" href="iconfont-3.html">
            <span class="wy_nav_info">
              <span class="wy_nav_title">移动端底部导航</span>
              <span class="wy_nav_desc">iconfont 字体图标 · 徽章与红点</span>
            </span>
            <span class="wy_nav_arrow">→</span>
          </a>
        </li>
        <li class="wy_nav_item">
          <a class="wy_nav_link" href="iconfont-4.html">
            <span class="wy_nav_info">
              <span class="wy_nav_title">移动端底部导航</span>
              <span class="wy_nav_desc">iconfont SVG · 徽章与红点</span>
            </span>
            <span class="wy_nav_arrow">→</span>
          </a>
        </li>
      </ul>
    </nav>

    <footer class="wy_footer">© MMXXVI · Designed with Care</footer>
  </main>
</body>
</html>
